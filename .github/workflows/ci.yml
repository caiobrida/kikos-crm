name: CI

on:
  push:
  pull_request:

# Um push logo em seguida cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala os três workspaces a partir do package-lock.json.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      # Sem serviço de Postgres de propósito: a seam de repositório permite
      # testar as rotas com a Layer em memória, então nenhum teste toca banco.
      - name: Tests
        run: npm run test
